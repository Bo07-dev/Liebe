        var t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
      if (bag[bag.length - 1] === last) {
        var s = bag[0]; bag[0] = bag[bag.length - 1]; bag[bag.length - 1] = s;
      }
    }
    last = bag.pop();
    return REASONS[last];
  }

  function spawnHearts() {
    if (reduceMotion) return;
    var symbols = ["💗", "💖", "💕", "❤️", "💞"];
    for (var i = 0; i < 14; i++) {
      var h = document.createElement("span");
      h.className = "heart";
      h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      h.style.left = Math.random() * 92 + "%";
      h.style.fontSize = 1.2 + Math.random() * 1.6 + "rem";
      h.style.setProperty("--dur", 2.4 + Math.random() * 2 + "s");
      h.style.setProperty("--sway", (Math.random() * 60 - 30) + "px");
      h.style.animationDelay = Math.random() * 0.5 + "s";
      h.addEventListener("animationend", function (e) { e.target.remove(); });
      heartsLayer.appendChild(h);
    }
  }

  ask.addEventListener("click", function () {
    ask.classList.remove("idle");

    answer.textContent = "";

    var opener = document.createElement("p");
    opener.className = "opener reveal";
    opener.textContent = nextOpener();

    var line = document.createElement("p");
    line.className = "line reveal";
    line.textContent = "Ich liebe dich " + nextReason() + ".";

    var strong = document.createElement("span");
    strong.className = "strong reveal";
    strong.textContent = nextCloser() + " " + pick(EMOJIS);

    var again = document.createElement("p");
    again.className = "again";
    again.textContent = "Nochmal tippen – ich hab noch ganz viele 💞";

    line.appendChild(strong);
    answer.appendChild(opener);
    answer.appendChild(line);
    answer.appendChild(again);

    spawnHearts();
  });
})();
</script>

    navigator.serviceWorker.register("sw.js").catch(function () {});
